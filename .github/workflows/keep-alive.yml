name: Keep Supabase project awake
# Free Supabase projects pause after ~7 days with no database activity.
# This pings the REST API every 3 days so the save backend never sleeps.
# Needs two repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL         the project's API URL (https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY     the project's anon public key (safe to store; it is
#                          the same key the site itself ships to every visitor)
on:
  schedule:
    - cron: '17 4 */3 * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the saves table through the REST API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/saves?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase REST responded with HTTP $code"
          # 200/206 = reachable and awake; RLS makes it return zero rows for
          # an unauthenticated key, which is fine, we only need the project
          # to register activity.
          if [ "$code" -ge 500 ]; then
            echo "::warning::Supabase did not respond cleanly (HTTP $code)"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
