<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Fish lab</title>
<style>body{margin:0;background:#1b2024;color:#ddd;font:12px sans-serif}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.min.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// A test bench for js/fishmodel.js: every species side by side (?only=id,id  ?yaw=deg  ?pitch=deg  ?w=1600  ?swim=1&t=0.3: a moment of the swimming wave)
import * as THREE from 'three';
import { ALL_FISH } from '../js/fishdata.js';
import { buildFish, SWIM } from '../js/fishmodel.js';
const q = new URLSearchParams(location.search);
const list = q.get('only') ? ALL_FISH.filter((f) => q.get('only').split(',').includes(f.id)) : ALL_FISH;
const cols = Number(q.get('cols') || 4), W = Number(q.get('w') || 1600), cellH = Number(q.get('ch') || 170);
const rows = Math.ceil(list.length / cols), H = rows * cellH;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2a3036');
scene.add(new THREE.HemisphereLight('#dfe8ff', '#4a4030', 1.6));
const sun = new THREE.DirectionalLight('#fff4e0', 2.4); sun.position.set(0.4, 1, 0.8); scene.add(sun);
const cw = 1.25, ch = cw * cellH / (W / cols);
const cam = new THREE.OrthographicCamera(0, cols * cw, 0, -rows * ch, -5, 5);
const yaw = Number(q.get('yaw') || 0) * Math.PI / 180, pitch = Number(q.get('pitch') || 0) * Math.PI / 180;
list.forEach((f, i) => {
  const g = buildFish(f, 1);
  g.rotation.set(pitch, yaw, 0);
  g.position.set((i % cols) * cw + cw / 2, -Math.floor(i / cols) * ch - ch * 0.5, 0);
  scene.add(g);
  const d = document.createElement('div');
  d.textContent = `${f.id} · ${f.vi}`;
  Object.assign(d.style, { position: 'absolute', left: `${(i % cols) * W / cols + 6}px`, top: `${Math.floor(i / cols) * cellH + 4}px` });
  document.body.appendChild(d);
});
SWIM.uSwimOn.value = q.has('swim') ? Number(q.get('swim')) : 0;
SWIM.uSwimT.value = Number(q.get('t') || 0);
r.render(scene, cam);
window.done = true;
</script>
</body>
</html>
